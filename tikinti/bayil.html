<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bayıl Bulvarı — 3D konsept</title>
<meta name="description" content="Bayıl Bulvarı: sahil boyu kompleksin interaktiv 3D konsepti — blok, mərtəbə və mənzil seçimi, mənzilin içinə giriş.">
<meta name="theme-color" content="#1a1411">
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root { --ink: #1a1411; --paper: #f7f1e8; --acc: #d9a46c; --line: rgba(255,255,255,.14); --sans: "Plus Jakarta Sans", system-ui, sans-serif; --serif: "Cormorant Garamond", Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--sans); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .top { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 16px; background: linear-gradient(rgba(26,20,17,.55), transparent); pointer-events: none; z-index: 5; }
  .brand { display: flex; flex-direction: column; pointer-events: auto; }
  .brand b { font-family: var(--serif); font-weight: 500; font-size: 30px; letter-spacing: .12em; line-height: 1; }
  .brand small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin-top: 6px; }
  #home { pointer-events: auto; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(26,20,17,.45); backdrop-filter: blur(12px); font-size: 13px; }
  #markers { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .mk { position: absolute; left: 0; top: 0; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); background: rgba(26,20,17,.72); backdrop-filter: blur(6px); font-family: var(--serif); font-size: 18px; transition: opacity .3s, background .2s, transform .1s linear; }
  .mk:hover, .mk.on { background: var(--acc); color: var(--ink); }
  #hint { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(26,20,17,.6); backdrop-filter: blur(10px); font-size: 13px; white-space: nowrap; z-index: 4; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #panel { position: fixed; left: 16px; top: 88px; bottom: 16px; width: 300px; display: flex; flex-direction: column; border-radius: 20px; background: rgba(26,20,17,.82); border: 1px solid var(--line); backdrop-filter: blur(18px); z-index: 6; overflow: hidden; }
  .ph { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
  .ph small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
  .ph h3 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 4px 0 2px; }
  .ph p { margin: 0; font-size: 13px; opacity: .75; }
  .x { position: absolute; right: 14px; top: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .fls { overflow-y: auto; padding: 8px; }
  .fl { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; }
  .fl:hover, .fl.on { background: rgba(217,164,108,.16); }
  .fl b { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); font-family: var(--serif); font-size: 18px; font-weight: 500; }
  .fl.on b { background: var(--acc); color: var(--ink); border-color: transparent; }
  .fl span { flex: 1; font-size: 14px; display: flex; flex-direction: column; }
  .fl small { font-size: 11px; opacity: .6; }
  .fl i { display: flex; gap: 4px; } .fl em { width: 7px; height: 7px; border-radius: 50%; }
  #aptLabels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .al { position: absolute; left: 0; top: 0; pointer-events: auto; display: grid; grid-template-columns: auto auto; column-gap: 8px; align-items: center; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(26,20,17,.8); backdrop-filter: blur(8px); text-align: left; }
  .al i { grid-row: span 2; width: 9px; height: 9px; border-radius: 50%; }
  .al b { font-size: 14px; } .al small { font-size: 11px; opacity: .7; }
  #apt { position: fixed; right: 16px; top: 88px; width: 320px; padding: 20px; border-radius: 20px; background: rgba(26,20,17,.86); border: 1px solid var(--line); backdrop-filter: blur(18px); z-index: 7; }
  #apt h3 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 6px 0 14px; }
  #apt dl { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0 0 16px; background: var(--line); border-radius: 12px; overflow: hidden; }
  #apt dl div { background: rgba(26,20,17,.9); padding: 10px 12px; } #apt dl .wide { grid-column: span 2; }
  #apt dt { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; } #apt dd { margin: 3px 0 0; font-size: 17px; font-weight: 600; }
  .go { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--acc); color: var(--ink); font-weight: 700; }
  #inside { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #exitApt { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); pointer-events: auto; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(26,20,17,.55); backdrop-filter: blur(10px); }
  .pad { position: fixed; right: 20px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; pointer-events: auto; }
  .pad button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: rgba(26,20,17,.55); backdrop-filter: blur(10px); font-size: 20px; touch-action: none; }
  @media (hover: hover) { .pad { display: none; } }
  #loader { position: fixed; inset: 0; background: var(--ink); z-index: 20; display: grid; place-items: center; transition: opacity 1.2s ease 0.4s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader b { font-family: var(--serif); font-weight: 500; font-size: 40px; letter-spacing: .14em; }
  .note { position: fixed; left: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 11px; opacity: .6; z-index: 4; max-width: 300px; }
  @media (max-width: 760px) {
    #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 46vh; border-radius: 20px 20px 0 0; }
    #apt { left: 12px; right: 12px; width: auto; top: auto; bottom: 12px; }
    .note { display: none; } #hint { bottom: auto; top: 86px; }
  }
  [hidden] { display: none !important; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
  <div id="loader"><b>BAYIL BULVARI</b></div>
  <canvas id="scene"></canvas>
  <header class="top">
    <div class="brand"><b>BAYIL BULVARI</b><small>Səbail · Bibiheybət · Liman küçəsi</small></div>
    <button id="home">Ümumi görünüş</button>
  </header>
  <div id="markers"></div>
  <div id="aptLabels"></div>
  <aside id="panel" hidden></aside>
  <div id="apt" hidden></div>
  <div id="inside" hidden>
    <button id="exitApt">✕ Mənzildən çıx</button>
    <div class="pad"><button id="fwd" aria-label="İrəli">▲</button><button id="back" aria-label="Geri">▼</button></div>
  </div>
  <p id="hint"></p>
  <p class="note">3D konsept — layihə renderləri əsasında hazırlanmış nümunədir. Mənzil sayı, ölçü və qiymətlər nümunədir.</p>
  <script type="module" src="js/bayil.js"></script>
</body>
</html>
